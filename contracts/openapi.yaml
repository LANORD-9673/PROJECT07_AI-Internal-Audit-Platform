components:
  schemas:
    AuditRunCreate:
      properties:
        policy_snapshot_id:
          type: string
          title: Policy Snapshot Id
        dataset_snapshot_id:
          type: string
          title: Dataset Snapshot Id
        authority_snapshot_id:
          type: string
          title: Authority Snapshot Id
        audit_name:
          type: string
          maxLength: 200
          minLength: 1
          title: Audit Name
      type: object
      required:
      - policy_snapshot_id
      - dataset_snapshot_id
      - authority_snapshot_id
      - audit_name
      title: AuditRunCreate
    Body_import_authorities_api_import_authorities_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        authority_id:
          type: string
          title: Authority Id
      type: object
      required:
      - file
      - authority_id
      title: Body_import_authorities_api_import_authorities_post
    Body_import_loans_api_import_loans_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        dataset_id:
          type: string
          title: Dataset Id
      type: object
      required:
      - file
      - dataset_id
      title: Body_import_loans_api_import_loans_post
    Body_import_policy_api_import_policies_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        policy_id:
          type: string
          title: Policy Id
        policy_set_id:
          type: string
          title: Policy Set Id
        effective_from:
          type: string
          title: Effective From
      type: object
      required:
      - file
      - policy_id
      - policy_set_id
      - effective_from
      title: Body_import_policy_api_import_policies_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
